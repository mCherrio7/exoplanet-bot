name: Weekly Exoplanet Detection Pipeline

on:
  schedule:
    - cron: '40 20 * * 3'
  workflow_dispatch:

jobs:
  run-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Exoplanet Search Bot
        run: python bot.py

      - name: Send Email with Candidate Report
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Exoplanet Bot Report: Candidate Found!"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: file://candidates/report.txt
          attachments: candidates/candidate_transit.png
