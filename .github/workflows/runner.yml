name: Weekly Exoplanet Detection Pipeline

on:
  schedule:
    - cron: '40 20 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Exoplanet Search Bot
        run: python bot.py

      - name: Commit Updated Artifacts and History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates/candidate_transit.png scanned_targets.txt || true
          git commit -m "Automated update: Save candidate transit plot and log target" || echo "No changes to commit"
          git push

      - name: Create GitHub Issue Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Exoplanet Bot Report: Scan Completed" \
            --body-file ./candidates/report.txt
