name: Weekly Exoplanet Detection Pipeline

on:
  schedule:
    - cron: '40 20 * * 3'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  run-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Exoplanet Search Bot
        run: python bot.py

      - name: Post Candidate to GitHub Issues
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "New Exoplanet Candidate Flagged"
          content-filepath: ./candidates/report.txt
          labels: exoplanet-candidate
